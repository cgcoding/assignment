<div class="streak-container">
	<div class="nav">
		<a routerLink="/habit">Back to Habits</a>
		&nbsp;&nbsp;
		<button type="button" (click)="logout()">Logout</button>
	</div>

	<h2>Habit Streak</h2>

	<label for="habitSelect">Select Habit:</label>
	<select id="habitSelect" [(ngModel)]="selectedHabitId" name="habitSelect">
		<option [ngValue]="null" disabled selected>-- choose a habit --</option>
		<option *ngFor="let h of habits" [ngValue]="h.habitId">{{ h.name }} -- {{ h.frequency }}</option>
	</select>
	&nbsp;&nbsp;
	<button type="button" (click)="calculateStreak()" [disabled]="selectedHabitId === null">
		Calculate streak
	</button>

	<div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

	<div *ngIf="streakCount !== null">
		<p *ngIf="streakCount > 0">
			Current Streak: {{ streakCount }} {{ selectedHabit?.frequency === 'Daily' ? 'days' : 'weeks' }}
		</p>
		<p *ngIf="streakCount === 0">No streak yet — complete this habit to get one started.</p>
	</div>
</div>

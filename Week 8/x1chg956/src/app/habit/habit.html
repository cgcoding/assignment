<div class="habit-container">
	<div class="nav">
		<a routerLink="/streak">View Streaks</a>
		&nbsp;&nbsp;
		<button type="button" (click)="logout()">Logout</button>
	</div>

	<h2>Add / Edit Habits</h2>

	<form (ngSubmit)="onSubmit()">
		<label for="habitName">Habit name:</label>
		<input id="habitName" type="text" [(ngModel)]="newHabit.name" name="habitName" required />
		&nbsp;&nbsp;
		<label for="habitFrequency">Frequency:</label>
		<select id="habitFrequency" [(ngModel)]="newHabit.frequency" name="habitFrequency">
			<option value="Daily">Daily</option>
			<option value="Weekly">Weekly</option>
		</select>
		&nbsp;&nbsp;
		<button type="submit">Save</button>
	</form>

	<div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

	<ol>
		<li *ngFor="let habit of habits; let i = index">
			{{ i + 1 }} — {{ habit.name }} — {{ habit.frequency }}
			&nbsp;
			<button type="button" (click)="completeHabit(habit)" [disabled]="habit.completed">
				{{ habit.completed ? 'Completed' : 'Complete' }}
			</button>
			<button type="button" (click)="deleteHabit(habit)">Delete</button>
		</li>
	</ol>
</div>
